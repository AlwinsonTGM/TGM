<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:">
  <title>TGM Terminal</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><span class="brand">TGM</span><h1>Terminal</h1><p>Run an installed harness in a project folder.</p></div>
    <span id="status" role="status" aria-live="polite">Not running</span>
  </header>
  <main>
    <div class="controls">
      <label>Harness <select id="harness"><option value="opencode">OpenCode</option><option value="agy">Antigravity CLI</option></select></label>
      <div class="folder"><span>Project folder</span><button id="folder" type="button">Choose folder</button><span id="folder-name">No folder selected</span></div>
      <button id="start" type="button" disabled>Start terminal</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <div id="error" role="alert"></div>
    <div id="terminal" aria-label="Interactive terminal"></div>
    <p class="hint">Copy selection: Ctrl+Shift+C · Paste: Ctrl+Shift+V</p>
  </main>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
