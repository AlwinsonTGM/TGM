<!doctype html><html><head><meta charset="utf-8"><title>Synthetic Tauri terminal test</title><link rel="stylesheet" href="xterm.css"><script src="xterm.js"></script><style>body{background:#111;color:white;font-family:sans-serif}#term{width:700px;height:300px}</style></head><body><h1>Tauri synthetic terminal test</h1><p id="status">Waiting for marker</p><div id="term"></div><script>
const terminal=new Terminal(); terminal.open(document.getElementById('term'));
const ws=new WebSocket('ws://127.0.0.1:39872/tauri-synthetic-proof-64f');
ws.onopen=()=>ws.send(JSON.stringify({type:'start'}));
ws.onmessage=event=>{terminal.write(event.data); if(event.data.includes('TAURI_PTY_ROUNDTRIP_64F')){document.getElementById('status').textContent='Renderer received PTY marker'; ws.send(JSON.stringify({type:'success'}));}};
</script></body></html>
